---
# Wersje dla app_servers sa dokladane do package_versions_effective.
# Klucz obecny tez we wspolnym (all) lub blue baseline zastepuje w nim wczesniejsza
# wartosc, np. ca-certificates. Pozostale klucze rozszerzaja wynikowy slownik.
package_versions_app:
  ca-certificates: "20260601~22.04.1"
  curl: "7.81.0-1ubuntu1.29"
  gnupg: "2.2.27-3ubuntu2.5"
  python3-pip: "22.0.2+dfsg-1ubuntu0.7"
  docker-ce: "5:29.4.3-1~ubuntu.22.04~jammy"
  docker-ce-cli: "5:29.4.0-1~ubuntu.22.04~jammy"
  containerd.io: "2.2.3-1~ubuntu.22.04~jammy"
  docker-compose-plugin: "5.1.3-1~ubuntu.22.04~jammy"
  auditd: "1:3.0.7-1ubuntu0.1"
  audispd-plugins: "1:3.0.7-1ubuntu0.1"

python_package_versions_app:
  docker: "7.1.0"

# Mozna sprawdzic obecna wersje:
# ansible all -i inventories/hosts.yml -m shell -a "for p in nazwa_pakietu nazwa_pakietu2 ; do echo '---' \$p '---'; dpkg -l \$p 2>/dev/null | grep '^ii' || echo 'not installed'; done" -u ansible --become
