---
# package_guard_unhold.yml
#
# Zdejmuje hold tylko wtedy, gdy pakiet wymaga naprawy:
# - pakiet nie istnieje w bazie dpkg,
# - nie jest w pelnym stanie "ok installed",
# - albo ma inna wersje niz przypieta w package_guard_packages.
#
# Za stan poprawnie zainstalowany uznajemy m.in.:
#   install ok installed
#   hold ok installed
# Pierwsze pole (selection) moze byc "install" albo "hold".
# Kluczowe sa dwa ostatnie pola: "ok installed".
#
# Za stan wymagajacy naprawy traktowane sa m.in.:
#   * ok not-installed
#   * ok config-files
#   * ok unpacked
#   * ok half-installed
#   * ok half-configured
#   * ok triggers-awaited
#   * ok triggers-pending
#   * reinstreq ...

- name: Sprawdz stan i wersje pakietow przed unhold
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - '-f=${Status}|${Version}'
      - "{{ item.split('=')[0] }}"
  loop: "{{ package_guard_packages }}"
  register: package_guard_versions
  changed_when: false
  failed_when: false

- name: Sprawdz blokady hold pakietow przed unhold
  ansible.builtin.command:
    argv:
      - dpkg
      - --get-selections
      - "{{ item.split('=')[0] }}"
  loop: "{{ package_guard_packages }}"
  register: package_guard_selections
  changed_when: false
  failed_when: false

- name: Zdejmij blokade hold dla pakietow wymagajacych zmiany
  ansible.builtin.dpkg_selections:
    name: "{{ item.split('=')[0] }}"
    selection: install
  register: package_guard_remove_hold_status
  until: package_guard_remove_hold_status is succeeded
  retries: 5
  delay: 5
  loop: "{{ package_guard_packages }}"
  loop_control:
    index_var: package_guard_index
  when:
    - package_guard_selections.results[package_guard_index].stdout | default('') | trim is search('\\bhold$')
    - >-
      package_guard_versions.results[package_guard_index].rc != 0
      or ' ok installed|' not in (package_guard_versions.results[package_guard_index].stdout | default(''))
      or (
        item is search('=')
        and
        ((package_guard_versions.results[package_guard_index].stdout | default('') | trim).split('|') | last | trim)
        != item.split('=')[1]
      )
