---
- name: Test SIGKILL przez systemctl
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Utworz testowa usluge
      ansible.builtin.copy:
        dest: /etc/systemd/system/sigkill-test.service
        mode: "0644"
        content: |
          [Unit]
          Description=Test service for SIGKILL

          [Service]
          Type=simple
          ExecStart=/usr/bin/sleep infinity

    - name: Przeladuj systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Uruchom testowa usluge
      ansible.builtin.systemd:
        name: sigkill-test.service
        state: started

    - name: Wykonaj SIGKILL
      ansible.builtin.command:
        argv:
          - systemctl
          - kill
          - --kill-who=all
          - --signal=SIGKILL
          - sigkill-test.service
      changed_when: true

    - name: Sprawdz status po SIGKILL
      ansible.builtin.command:
        argv:
          - systemctl
          - status
          - sigkill-test.service
          - --no-pager
      register: sigkill_status
      changed_when: false
      failed_when: false

    - name: Pokaz wynik
      ansible.builtin.debug:
        var: sigkill_status.stdout_lines