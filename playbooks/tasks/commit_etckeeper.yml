- name: Pokaz blad commitu etckeeper (jesli wystapil)
  ansible.builtin.debug:
    msg: "UWAGA: etckeeper commit zakonczyl sie rc={{ etckeeper_commit.rc }}. stdout: {{ etckeeper_commit.stdout }} | stderr: {{ etckeeper_commit.stderr }}"
  when: etckeeper_commit.rc is defined and etckeeper_commit.rc != 0
