---
# Pierwsze odpalenie: openssl rand -base64 32 > inventories/.vault_passwords/generated_admin_secrets.pass
# plik generated_admin_secrets.pass powinien byc zastapiony przez managera hasel/sekretow w srodowisku produkcyjnym.
# Nastepnie: ansible-playbook -i inventories/hosts.yml playbooks/rotate_passwords.yml -K
# Kolejne uruchomienia: ansible-playbook -i inventories/hosts.yml playbooks/rotate_passwords.yml -K --vault-password-file inventories/.vault_passwords/generated_admin_secrets.pass

- name: Rotacja hasel w oparciu o jawny target (password_target)
  hosts: "{{ password_target | default('all') }}"
  become: true
  gather_facts: false
  any_errors_fatal: true

  vars:
    target_user: ansible
    inv_dir: "{{ playbook_dir }}/../inventories"

    # Staly plik z haslem do Ansible Vault dla generowanych plikow z haslami administratora.
    # Nie jest kasowany. Nie lezy w host_vars/group_vars jako YAML, wiec Ansible nie laduje go jako zmiennych.
    # W rzeczywistosci haslo powinno isc do managera hasel/sekretow.
    # W ramach malego srodowiska testowego mozna zalozyc, ze jest usuwany regularnie.
    # Metodami uniemozliwiajacymi jego odtworzenie.
    generated_vault_pass_file: "{{ inv_dir }}/.vault_passwords/generated_admin_secrets.pass"

    # Docelowy plik generowany per host.
    # Uwaga: rozszerzenie .pass zapobiega automatycznemu ladowaniu przez Ansible jako host_vars.
    # Po pierwszym zaszyfrowaniu kolejne uruchomienia wymagaja podania tego samego vault password file.
    generated_secret_file: "{{ inv_dir }}/host_vars/{{ inventory_hostname }}/secrets.pass"    # Domyslnie ukrywamy sekrety w logach. Do debugowania mozna odpalic z: -e hide_sensitive_logs=false
    hide_sensitive_logs: false


  pre_tasks:
    # Plik hasla Vault jest przygotowywany na kontrolerze. Target okresla
    # zakres kont, ale zaszyfrowany sekret zapisywany jest osobno dla hosta.
    - name: Upewnienie sie, ze katalog na haslo Vault istnieje
      ansible.builtin.file:
        path: "{{ generated_vault_pass_file | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Sprawdzenie, czy plik hasla Vault istnieje
      ansible.builtin.stat:
        path: "{{  generated_vault_pass_file }}"
      register:  generated_vault_pass_file_stat
      delegate_to: localhost
      become: false
      run_once: true
      no_log: "{{ hide_sensitive_logs }}"

    - name: Wygenerowanie pliku hasla Vault, jesli nie istnieje
      ansible.builtin.copy:
        dest: "{{  generated_vault_pass_file }}"
        content: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
        mode: "0600"
      when: not  generated_vault_pass_file_stat.stat.exists
      delegate_to: localhost
      become: false
      run_once: true
      no_log: "{{ hide_sensitive_logs }}"

    - name: Ustalenie nazwy i typu targetu
      ansible.builtin.set_fact:
        t_name: "{{ password_target | default('all') }}"
        t_is_group: "{{ (password_target | default('all')) in groups }}"
        t_is_host: "{{ (password_target | default('all')) in hostvars }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Sprawdzenie poprawnosci parametru password_target
      ansible.builtin.assert:
        that:
          - t_is_group or t_is_host
          - not (t_is_group and t_is_host)
        fail_msg: "Target '{{ t_name }}' nie istnieje lub jest niejednoznaczny."
      delegate_to: localhost
      become: false
      run_once: true

    - name: Upewnienie sie, ze katalog na staly plik hasla Vault istnieje
      ansible.builtin.file:
        path: "{{ generated_vault_pass_file | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Utworzenie stalego pliku hasla Vault, jezeli jeszcze nie istnieje
      ansible.builtin.set_fact:
        generated_vault_password: >-
          {{
            lookup(
              'ansible.builtin.password',
              generated_vault_pass_file ~ ' length=40 chars=ascii_letters,digits'
            )
          }}
      delegate_to: localhost
      become: false
      run_once: true
      no_log: "{{ hide_sensitive_logs }}"

    - name: Ustawienie bezpiecznych uprawnien na pliku hasla Vault
      ansible.builtin.file:
        path: "{{ generated_vault_pass_file }}"
        state: file
        mode: "0600"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Weryfikacja sudo przed rotacja hasel
      ansible.builtin.command: whoami
      register: sudo_check
      changed_when: false
      failed_when: sudo_check.stdout != 'root'

  tasks:
    - name: Rotacja hasla i zapis zaszyfrowanego pliku z haslem administratora
      block:
        - name: Generowanie unikalnego hasla dla hosta
          ansible.builtin.set_fact:
            generated_password: >-
              {{
                lookup(
                  'ansible.builtin.password',
                  '/dev/null',
                  length=20,
                  chars=['ascii_letters', 'digits']
                )
              }}
          no_log: "{{ hide_sensitive_logs }}"

        - name: Inicjalizacja flagi zmiany hasla systemowego
          ansible.builtin.set_fact:
            host_password_updated: false
          no_log: "{{ hide_sensitive_logs }}"

        - name: Upewnienie sie, ze katalog host_vars dla przetwarzanego hosta istnieje
          ansible.builtin.file:
            path: "{{ generated_secret_file | dirname }}"
            state: directory
            mode: "0755"
          delegate_to: localhost
          become: false

        - name: Sprawdzenie, czy plik secrets.pass istnieje
          ansible.builtin.stat:
            path: "{{ generated_secret_file }}"
          register: generated_secret_stat
          delegate_to: localhost
          become: false

        - name: Sprawdzenie naglowka pliku secrets.pass
          ansible.builtin.command:
            argv:
              - head
              - -n
              - "1"
              - "{{ generated_secret_file }}"
          register: generated_secret_header
          changed_when: false
          failed_when: false
          when: generated_secret_stat.stat.exists
          delegate_to: localhost
          become: false

        # Operacja celowo nie jest idempotentna: rotacja ma uniewaznic poprzedni sekret.
        # Odszyfrowanie tworzy plaintext tylko tymczasowo na kontrolerze Ansible.
        # Istniejacy plik jest odszyfrowywany przed edycja. Jesli nie mozna
        # go odszyfrowac, playbook tworzy kopie przed odtworzeniem pliku.
        - name: Odszyfrowanie istniejacego secrets.pass przed edycja
          ansible.builtin.command:
            argv:
              - ansible-vault
              - decrypt
              - "{{ generated_secret_file }}"
              - "--vault-password-file"
              - "{{ generated_vault_pass_file }}"
          when:
            - generated_secret_stat.stat.exists
            - generated_secret_header.stdout is defined
            - generated_secret_header.stdout is match('^\\$ANSIBLE_VAULT;')
          delegate_to: localhost
          become: false
          register: generated_secret_decrypt
          changed_when: generated_secret_decrypt.rc == 0
          failed_when: false
          no_log: "{{ hide_sensitive_logs }}"

        - name: Utworzenie sciezki bez rozszerzenia .pass
          ansible.builtin.set_fact:
            generated_secret_file_without_ext: "{{ generated_secret_file | regex_replace('\\.pass$', '') }}"

        - name: Backup secrets.pass, ktorego nie mozna odszyfrowac aktualnym Vault
          ansible.builtin.copy:
            src: "{{ generated_secret_file }}"
            dest: "{{ generated_secret_file_without_ext }}-undecryptable-{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}.pass"
            remote_src: true
            mode: "0600"
          when:
            - generated_secret_stat.stat.exists
            - generated_secret_header.stdout is defined
            - generated_secret_header.stdout is match('^\\$ANSIBLE_VAULT;')
            - generated_secret_decrypt.rc is defined
            - generated_secret_decrypt.rc != 0
          delegate_to: localhost
          become: false
          no_log: "{{ hide_sensitive_logs }}"

        - name: Usuniecie nieodszyfrowywalnego secrets.pass przed odtworzeniem
          ansible.builtin.file:
            path: "{{ generated_secret_file }}"
            state: absent
          when:
            - generated_secret_stat.stat.exists
            - generated_secret_header.stdout is defined
            - generated_secret_header.stdout is match('^\\$ANSIBLE_VAULT;')
            - generated_secret_decrypt.rc is defined
            - generated_secret_decrypt.rc != 0
          delegate_to: localhost
          become: false
          no_log: "{{ hide_sensitive_logs }}"

        - name: Uaktualnienie hasla systemowego uzytkownika
          ansible.builtin.user:
            name: "{{ target_user }}"
            password: "{{ generated_password | ansible.builtin.password_hash('sha512') }}"
            update_password: always
          no_log: "{{ hide_sensitive_logs }}"

        - name: Oznaczenie, ze haslo systemowe zostalo zmienione
          ansible.builtin.set_fact:
            host_password_updated: true
          no_log: "{{ hide_sensitive_logs }}"

        - name: Zapis unikalnego hasla do secrets.pass
          ansible.builtin.lineinfile:
            path: "{{ generated_secret_file }}"
            regexp: "^rotated_{{ target_user | regex_escape }}_password\\s*:"
            line: 'rotated_{{ target_user }}_password: "{{ generated_password }}"'
            state: present
            create: true
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: "{{ hide_sensitive_logs }}"

        # Plik jest ponownie szyfrowany po kazdej zmianie; w systemie produkcyjnym
        # docelowym miejscem przechowywania hasel powinien byc password manager.
        - name: Szyfrowanie secrets.pass po aktualizacji
          ansible.builtin.command:
            argv:
              - ansible-vault
              - encrypt
              - "{{ generated_secret_file }}"
              - "--vault-password-file"
              - "{{ generated_vault_pass_file }}"
          delegate_to: localhost
          become: false
          no_log: "{{ hide_sensitive_logs }}"

      rescue:
        - name: Dolacz wspolna obsluge bledu
          ansible.builtin.include_tasks: tasks/rescue_report_failure.yml

      always:
        - name: Dolacz wspolne taski etckeeper
          ansible.builtin.include_tasks: tasks/commit_etckeeper.yml
          vars:
            etckeeper_commit_message: "Ansible: rotate_passwords"
