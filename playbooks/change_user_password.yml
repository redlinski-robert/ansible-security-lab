---
- name: Ustaw haslo dla wybranego uzytkownika
  hosts: "{{ change_user_password_target | default('all') }}"
  become: true
  gather_facts: false

  vars_prompt:
    - name: secret_manage_password
      prompt: Podaj nowe haslo dla usera (awaryjny reset)
      private: true
      confirm: true

  vars:
    target_user: ansible
    inv_dir: "{{ playbook_dir }}/../inventories"
    generated_vault_pass_file: "{{ inv_dir }}/.vault_passwords/generated_admin_secrets.pass"
    generated_secret_file: "{{ inv_dir }}/host_vars/{{ inventory_hostname }}/secrets.pass"

  pre_tasks:
    # Plik hasla Vault jest przechowywany na kontrolerze. Nie jest to haslo
    # ustawiane na koncie zdalnym. Zadania localhost przygotowuja go przed zmiana.
    - name: Upewnienie sie, ze katalog na haslo Vault istnieje
      ansible.builtin.file:
        path: "{{ generated_vault_pass_file | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Sprawdzenie, czy plik hasla Vault istnieje
      ansible.builtin.stat:
        path: "{{ generated_vault_pass_file }}"
      register: generated_vault_pass_file_stat
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true

    - name: Wygenerowanie pliku hasla Vault, jesli nie istnieje
      ansible.builtin.copy:
        dest: "{{ generated_vault_pass_file }}"
        content: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
        mode: "0600"
      when: not generated_vault_pass_file_stat.stat.exists
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true

  tasks:
    - name: Weryfikacja hasla wejsciowego
      ansible.builtin.assert:
        that:
          - target_user is string
          - target_user | trim | length > 0
          - secret_manage_password is string
          - secret_manage_password | length > 7
        fail_msg: >-
          target_user musi wskazywac uzytkownika, a podane haslo musi miec
          co najmniej 8 znakow.

    - name: Ustawienie hasla
      block:
        - name: Ustaw haslo
          ansible.builtin.user:
            name: "{{ target_user }}"
            password: "{{ secret_manage_password | password_hash('sha512', ((inventory_hostname ~ secret_manage_password) | hash('sha1'))[0:16]) }}"
          no_log: true

        - name: Upewnienie sie, ze katalog host_vars dla przetwarzanego hosta istnieje
          ansible.builtin.file:
            path: "{{ generated_secret_file | dirname }}"
            state: directory
            mode: "0755"
          delegate_to: localhost
          become: false

        - name: Sprawdzenie, czy plik secrets.pass istnieje
          ansible.builtin.stat:
            path: "{{ generated_secret_file }}"
          register: generated_secret_stat
          delegate_to: localhost
          become: false
          no_log: true

        # Istniejacy plik sekretow moze byc juz zaszyfrowany. Przed edycja
        # sprawdzany jest jego naglowek i podejmowana proba odszyfrowania.
        - name: Sprawdzenie naglowka pliku secrets.pass
          ansible.builtin.command:
            argv:
              - head
              - -n
              - "1"
              - "{{ generated_secret_file }}"
          register: generated_secret_header
          changed_when: false
          failed_when: false
          when: generated_secret_stat.stat.exists
          delegate_to: localhost
          become: false
          no_log: true

        # Operacja celowo nie jest idempotentna: zmiana hasla ma uniewaznic poprzedni sekret.
        # Odszyfrowanie tworzy plaintext tylko tymczasowo na kontrolerze Ansible.
        # Plik secrets.pass bedzie ponownie zaszyfrowany po dokonaniu zmian.
        # W systemie produkcyjnym docelowym miejscem przechowywania hasel powinien byc password manager.
        - name: Odszyfrowanie istniejacego secrets.pass przed edycja
          ansible.builtin.command:
            argv:
              - ansible-vault
              - decrypt
              - "{{ generated_secret_file }}"
              - "--vault-password-file"
              - "{{ generated_vault_pass_file }}"
          when:
            - generated_secret_stat.stat.exists
            - generated_secret_header.stdout is defined
            - generated_secret_header.stdout is match('^\\$ANSIBLE_VAULT;')
          delegate_to: localhost
          become: false
          register: generated_secret_decrypt
          changed_when: generated_secret_decrypt.rc == 0
          failed_when: false
          no_log: true

        - name: Utworzenie sciezki bez rozszerzenia .pass
          ansible.builtin.set_fact:
            generated_secret_file_without_ext: "{{ generated_secret_file | regex_replace('\\.pass$', '') }}"

        - name: Backup secrets.pass, ktorego nie mozna odszyfrowac aktualnym Vault
          ansible.builtin.copy:
            src: "{{ generated_secret_file }}"
            dest: "{{ generated_secret_file_without_ext }}-undecryptable-{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}.pass"
            remote_src: true
            mode: "0600"
          when:
            - generated_secret_stat.stat.exists
            - generated_secret_header.stdout is defined
            - generated_secret_header.stdout is match('^\\$ANSIBLE_VAULT;')
            - generated_secret_decrypt.rc is defined
            - generated_secret_decrypt.rc != 0
          delegate_to: localhost
          become: false
          no_log: true

        - name: Usuniecie nieodszyfrowywalnego secrets.pass przed odtworzeniem
          ansible.builtin.file:
            path: "{{ generated_secret_file }}"
            state: absent
          when:
            - generated_secret_stat.stat.exists
            - generated_secret_header.stdout is defined
            - generated_secret_header.stdout is match('^\\$ANSIBLE_VAULT;')
            - generated_secret_decrypt.rc is defined
            - generated_secret_decrypt.rc != 0
          delegate_to: localhost
          become: false
          no_log: true
          
        # Operacja celowo nie jest idempotentna: zmiana hasla ma uniewaznic poprzedni sekret.
        - name: Zapis hasla uzytkownika do secrets.pass
          ansible.builtin.lineinfile:
            path: "{{ generated_secret_file }}"
            regexp: "^rotated_{{ target_user | regex_escape }}_password\\s*:"
            line: 'rotated_{{ target_user }}_password: "{{ secret_manage_password }}"'
            state: present
            create: true
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true

        # Plik jest ponownie szyfrowany po kazdej zmianie; w systemie produkcyjnym
        # docelowym miejscem przechowywania hasel powinien byc password manager.
        - name: Szyfrowanie secrets.pass po aktualizacji
          ansible.builtin.command:
            argv:
              - ansible-vault
              - encrypt
              - "{{ generated_secret_file }}"
              - "--vault-password-file"
              - "{{ generated_vault_pass_file }}"
          delegate_to: localhost
          become: false
          no_log: true

      rescue:
        - name: Dolacz wspolna obsluge bledu
          ansible.builtin.include_tasks: tasks/rescue_report_failure.yml

      always:
        - name: Dolacz wspolne taski etckeeper
          ansible.builtin.include_tasks: tasks/commit_etckeeper.yml
          vars:
            etckeeper_commit_message: "Ansible: change_user_password"
