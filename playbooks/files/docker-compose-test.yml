version: '3.8'

services:
  db:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    container_name: app_db
    security_opt:
      - apparmor=apparmor-db
    networks:
      - internal_net

  backend:
    build: ./backend
    container_name: app_backend
    security_opt:
      - apparmor=apparmor-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=db
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,json,sys; r=urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3); data=json.loads(r.read()); sys.exit(0 if r.status == 200 and data.get('status') == 'healthy' else 1)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: app_frontend
    user: root
    security_opt:
      - apparmor=apparmor-frontend
    ports:
      - "8443:5173"
    environment:
      - NODE_ENV=development
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5173/', r => process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  internal_net:
    driver: bridge