# Wymusza korzystanie z HTTPS przez rok po pierwszej bezpiecznej odpowiedzi.
add_header Strict-Transport-Security "max-age=31536000" always;
# Ogranicza zrodla zasobow oraz osadza aplikacje tylko z tej samej polityki.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Blokuje interpretowanie odpowiedzi jako innego typu MIME.
add_header X-Content-Type-Options "nosniff" always;
# Ogranicza informacje o adresie zrodlowym przekazywane przy przejsciach miedzy stronami.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Blokuje dostep do kamery, mikrofonu i geolokalizacji dla dokumentow.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Blokuje osadzanie strony w ramce, co ogranicza ataki clickjacking.
add_header X-Frame-Options "DENY" always;
