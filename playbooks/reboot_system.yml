---
- name: Restart systemow
  hosts: blue_group
  become: true
  tasks:
    # rescue/always wymagaja bloku - pojedynczy task ich nie obsluguje (poprzednio niepoprawna struktura)
    - name: Restart hosta z zapisem stanu etckeeper
      block:
        # Modul czeka na ponowna dostepnosc hosta po restarcie. Nie jest to
        # jedynie wyslanie polecenia reboot bez kontroli powrotu maszyny.
        - name: Restartuj maszyne
          reboot:
            msg: "System zostanie zrestartowany przez Ansible"
            connect_timeout: 5
            reboot_timeout: 300
            pre_reboot_delay: 0
            post_reboot_delay: 30
            test_command: whoami

      rescue:
        - name: Dolacz wspolna obsluge bledu
          ansible.builtin.include_tasks: tasks/rescue_report_failure.yml

      always:
        - name: Dolacz wspolne taski etckeeper
          ansible.builtin.include_tasks: tasks/commit_etckeeper.yml
          vars:
            etckeeper_commit_message: "Ansible: reboot_system"
