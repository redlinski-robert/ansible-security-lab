[defaults]
# Wskazanie sciezki do logow (plik utworzy sie sam, ale folder ./logs musi istniec)
log_path = ./logs/ansible.log

# Zmiana formatu wyswietlania na ekranie na bardziej czytelny (YAML zamiast dlugich linii JSON)
stdout_callback = yaml

# Wylaczenie sprawdzania kluczy SSH hostow (w lab)
host_key_checking = False

# Domyslny plik inventory
inventory = ./inventories/hosts.yml

# Ignorowanie plikow z rozszerzeniem .pass w katalogu inventory (np. vault_passwords)
# Dzieki temu Ansible nie bedzie probowal parsowac tych plikow jako inventory
# Czyli playbooki nie beda musialy pobierac hasel z tych plikow
# I nie bedzie konieczne podawanie hasla za kazdym razem przy uruchamianiu playbookow
inventory_ignore_extensions = .pass

# Wlaczenie callbackow Ansible (np. profilowanie zadan)
# Callbacks sa wtyczkami Ansible, ktore pozwalaja na rozszerzenie funkcjonalnosci
# Profilowanie zadan pozwala na monitorowanie czasu wykonania poszczegolnych taskow
#callbacks_enabled = ansible.posix.profile_tasks

